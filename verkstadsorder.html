<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verkstadsorder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hazard-bar"></div>
  <div class="appbar">
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>Verkstadsorder</h1>
      <div class="sub">Arbete i egen verkstad</div>
    </div>
  </div>

  <div class="progress"></div>
  <div class="step-label"></div>

  <main>
    <div class="status-banner"><div class="msg" id="statusMsg"></div></div>

    <form id="verkstadsorderForm">

      <!-- Steg 1: Grunddata -->
      <section class="step" data-label="Grunddata">
        <div class="field">
          <label for="datum">Datum <span class="required">*</span></label>
          <input type="date" id="datum" required>
        </div>
        <div class="field">
          <label for="kund">Kund <span class="required">*</span></label>
          <input type="text" id="kund" required>
        </div>
        <div class="field">
          <label for="ordernummer">Ordernummer</label>
          <div class="hint">tex. 30071234</div>
          <input type="text" id="ordernummer">
        </div>
      </section>

      <!-- Steg 2: Tekniker -->
      <section class="step" data-label="Tekniker">
        <div class="field">
          <label>Vår/a montör/er <span class="required">*</span></label>
          <div id="teknikerContainer"></div>
        </div>
      </section>

      <!-- Steg 3: Arbete -->
      <section class="step" data-label="Arbete">
        <div class="field">
          <label for="sarttid">Sarttid <span class="required">*</span></label>
          <div class="hint">när påbörjades ordern?</div>
          <input type="time" id="sarttid" required>
        </div>
        <div class="field">
          <label for="stoptid">Stoptid <span class="required">*</span></label>
          <div class="hint">när var den färdig?</div>
          <input type="time" id="stoptid" required>
        </div>
        <div class="field">
          <label for="rast">Rast?</label>
          <div class="hint">om ja, hur många minuter?</div>
          <input type="text" id="rast" inputmode="numeric">
        </div>
        <div class="field">
          <label for="beskrivArbetet">Beskriv arbetet <span class="required">*</span></label>
          <div class="hint">till exempel: tillverkning medbringarband / band ändlös / band för montering… etc</div>
          <textarea id="beskrivArbetet" required></textarea>
        </div>
        <div class="field">
          <label>Ifylldes skarvprotokoll <span class="required">*</span></label>
          <div class="radio-row"><input type="radio" name="skarvprotokoll" value="Ja" id="sk_ja"><label for="sk_ja">Ja</label></div>
          <div class="radio-row"><input type="radio" name="skarvprotokoll" value="Nej" id="sk_nej"><label for="sk_nej">Nej</label></div>
          <div class="radio-row"><input type="radio" name="skarvprotokoll" value="Ej aktuellt" id="sk_ej"><label for="sk_ej">Ej aktuellt</label></div>
        </div>
      </section>

      <!-- Steg 4: Material -->
      <section class="step" data-label="Material">
        <div id="materialContainer"></div>
        <button type="button" class="add-material-btn" id="addMaterialBtn">+ Lägg till material</button>
      </section>

      <!-- Steg 5: Avslutning -->
      <section class="step" data-label="Avslutning">
        <div class="field">
          <label for="fordrojning">Eventuellt fördröjning / produktion över flera dagar…</label>
          <input type="text" id="fordrojning">
        </div>
        <div class="field">
          <label for="misstag">Eventuellt misstag</label>
          <input type="text" id="misstag">
        </div>
        <div class="field">
          <label for="ovrigt">Övriga anmärkningar:</label>
          <input type="text" id="ovrigt">
        </div>
        <div class="field">
          <label>Nöjdhet med jobbet:</label>
          <div class="stars" id="stars">
            <button type="button">★</button><button type="button">★</button>
            <button type="button">★</button><button type="button">★</button>
            <button type="button">★</button>
          </div>
        </div>
        <button type="button" class="btn primary" id="submitBtn" style="margin-top:8px;">Skicka</button>
      </section>

    </form>
  </main>

  <div class="bottom-nav" id="bottomNav">
    <button type="button" class="btn ghost back-btn" id="backBtn">Bakåt</button>
    <button type="button" class="btn primary" id="nextBtn">Nästa</button>
  </div>

<script src="app.js"></script>
<script>
  const form = document.getElementById("verkstadsorderForm");
  renderTeknikerCheckboxes(document.getElementById("teknikerContainer"));
  const materialUI = initMaterialList(
    document.getElementById("materialContainer"),
    document.getElementById("addMaterialBtn")
  );
  const starsUI = initStars(document.getElementById("stars"));
  const steps = initSteps(form);

  const nextBtn = document.getElementById("nextBtn");
  const backBtn = document.getElementById("backBtn");

  function syncNav() {
    const last = steps.current === steps.total - 1;
    nextBtn.style.display = last ? "none" : "flex";
    backBtn.style.display = steps.current === 0 ? "none" : "flex";
  }
  nextBtn.addEventListener("click", () => { steps.next(); syncNav(); });
  backBtn.addEventListener("click", () => { steps.back(); syncNav(); });
  syncNav();

  function radioVal(name) {
    const el = form.querySelector(`input[name="${name}"]:checked`);
    return el ? el.value : "";
  }

  document.getElementById("submitBtn").addEventListener("click", () => {
    const fields = {
      Datum: document.getElementById("datum").value,
      Kund: document.getElementById("kund").value,
      Ordernummer: document.getElementById("ordernummer").value,
      Tekniker: getTeknikerValue(document.getElementById("teknikerContainer")),
      Sarttid: document.getElementById("sarttid").value,
      Stoptid: document.getElementById("stoptid").value,
      Rast: document.getElementById("rast").value,
      BeskrivArbetet: document.getElementById("beskrivArbetet").value,
      Skarvprotokoll: radioVal("skarvprotokoll"),
      Fordrojning: document.getElementById("fordrojning").value,
      Misstag: document.getElementById("misstag").value,
      OvrigaAnmarkningar: document.getElementById("ovrigt").value,
      NojdhetJobbet: starsUI.getValue(),
    };
    const materials = getMaterialsData(document.getElementById("materialContainer"));

    submitForm({
      formType: "verkstadsorder",
      fields,
      materials,
      submitBtn: document.getElementById("submitBtn"),
      statusEl: document.getElementById("statusMsg"),
    });
  });
</script>
</body>
</html>
